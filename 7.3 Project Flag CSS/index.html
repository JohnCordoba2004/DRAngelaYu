<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Red Rec */
      .flag {
        width: 900px;
        height: 600px;
        background-color: #ce1126;
        position: relative;
      }

      /* Blue Rec */
      .flag > div {
        width: 100%;
        height: 300px;
        background-color: #002868;
        position: absolute;
        top: 150px;
      }

      /* White circle */
      .flag div > div {
        width: 200px;
        height: 200px;
        background-color: white;
        border-radius: 50%;
        position: relative;
        top: 50px;
        left: 350px;
      }

      p {
        margin: 0;
        font-size: 5rem;
        text-align: center;
        color: #ffffff;
      }

      .flag div div p {
        color: black;
      }
    </style>
  </head>
  <body>
    <div class="flag">
      <p>The Flag</p>

      <div>
        <div>
          <p>of Laos</p>
        </div>
      </div>
    </div>
  </body>
</html>
